name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIWORLD_LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-b12-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/spine-player.js
      - name: Seven-day quality gate
        run: python -m rpg_quality --output out/b10/e2e-report.json
      - name: Worst-cost stress matrix
        run: python -m rpg_stress --output out/b11/cost-report.json
      - name: Deployment configuration check
        run: python -m rpg_deploy config-check
      - name: Build and verify release
        run: |
          python -m rpg_deploy build --output out/b12/release --built-at 2026-11-01T00:00:00Z
          python -m rpg_deploy verify --release out/b12/release
