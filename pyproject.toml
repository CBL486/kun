[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-world"
version = "0.1.0"
description = "A persistent RPG town with one primary AI agent and scripted NPCs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
server = [
  "asyncpg>=0.30,<1",
  "apscheduler>=3.11,<4",
  "embedded-postgres>=18.6,<19",
]

[tool.setuptools.packages.find]
include = ["app*", "rpg_sim*", "rpg_agent*", "rpg_npc*", "rpg_storage*", "rpg_orm*", "agent_core*", "world_engine*", "narrative_director*", "npc_runtime*", "memory_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
